services:
  app:
    build:
      context: .
      args:
        APP_PORT: ${APP_PORT:-18473}
    ports:
      - "${APP_PORT:-18473}:${APP_PORT:-18473}"
    environment:
      PORT: ${APP_PORT:-18473}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/onlyweb.db}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-18473}}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
      WIKI_VAULT_PATH: ${WIKI_VAULT_PATH:-/app/wiki-vault}
      WIKI_PUBLIC: ${WIKI_PUBLIC:-false}
      WIKI_EXCLUDE_DIRS: ${WIKI_EXCLUDE_DIRS:-.obsidian,_raw,.git}
      WIKI_HOST_VAULT_PATH: ${WIKI_HOST_VAULT_PATH:-../wiki/vault}
      WIKI_HOST_BROWSE_ROOT: ${WIKI_HOST_BROWSE_ROOT:-../wiki}
      WIKI_CONTAINER_BROWSE_ROOT: ${WIKI_CONTAINER_BROWSE_ROOT:-/host-browse}
      ENV_FILE_PATH: ${ENV_FILE_PATH:-/app-config/.env}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      - .:/app-config
      - ${WIKI_HOST_VAULT_PATH:-../wiki/vault}:${WIKI_VAULT_PATH:-/app/wiki-vault}
      - ${WIKI_HOST_BROWSE_ROOT:-../wiki}:${WIKI_CONTAINER_BROWSE_ROOT:-/host-browse}
